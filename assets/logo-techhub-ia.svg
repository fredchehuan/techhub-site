<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente linear idêntico ao var(--accent-gradient) do CSS -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00C9B6" />
    </linearGradient>

    <!-- Filtro de sombra: glow + profundidade -->
    <!-- <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00C9B6" flood-opacity="0.4" />
    </filter> -->
  </defs>

  <!-- Fundo com gradiente e cantos arredondados 14px -->
  <rect width="64" height="64" rx="14" fill="url(#grad)" filter="url(#shadow)" />

  <!-- Borda fina branca semi-transparente (igual ao border: 1px solid rgba(255,255,255,0.25)) -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Traço horizontal do T – arredondado -->
  <rect x="14" y="14" width="36" height="10" rx="5" fill="#0A0A0A" />

  <!-- Haste vertical do T – arredondada -->
  <rect x="27" y="14" width="10" height="38" rx="5" fill="#0A0A0A" />
</svg>